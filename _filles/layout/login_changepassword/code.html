<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Alterar Senha - Ponto Direto POS</title>

                        "primary-fixed-dim": "#b6c7eb",
                        "on-tertiary-fixed": "#161c22",
                        "tertiary-fixed-dim": "#c1c7cf",
                        "secondary-fixed": "#ffdcc3",
                        "surface-container-high": "#dce9ff",
                        "on-primary-fixed": "#081b38",
                        "surface-container-highest": "#d3e4fe",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#44474d",
                        "surface-variant": "#d3e4fe",
                        "on-background": "#0b1c30",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary-fixed": "#d7e2ff",
                        "secondary-fixed-dim": "#ffb77d",
                        "on-secondary-fixed-variant": "#6e3900",
                        "surface": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#41474e",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#8d939a",
                        "on-primary-fixed-variant": "#374765",
                        "secondary-container": "#fd8b00",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c5c6ce",
                        "primary": "#031632",
                        "surface-container-low": "#eff4ff",
                        "surface-bright": "#f8f9ff",
                        "outline": "#75777e",
                        "surface-tint": "#4e5f7e",
                        "on-surface": "#0b1c30",
                        "on-secondary-fixed": "#2f1500",
                        "inverse-surface": "#213145",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#dde3eb",
                        "tertiary": "#11171d",
                        "secondary": "#904d00",
                        "on-secondary-container": "#603100",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "touch-margin": "16px",
                        "base": "8px",
                        "gutter": "20px",
                        "target-min": "48px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "numeral-xl": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-price": ["Inter"],

                        "label-bold": ["Inter"]
                    },
                    "fontSize": {
                        "numeral-xl": ["36px", {"lineHeight": "44px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],

                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                        "label-bold": ["14px", {"lineHeight": "20px", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .industrial-shadow {
            box-shadow: 0 4px 6px -1px rgba(3, 22, 50, 0.05), 0 2px 4px -1px rgba(3, 22, 50, 0.03);
        }
        input:focus {
            outline: none;
            box-shadow: inset 0 0 0 1px #031632;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-background">
<!-- Auth Container -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant p-gutter rounded-lg industrial-shadow flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-gutter w-full flex justify-center">
<img alt="Ponto Direto Logo" class="h-16 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0uiregR0vDeb7Ijj5DSYtC6BohXKFtgk82B2zOeT2tBGVeFu63INr37i9GafduBduZQMrgtbxt3anKsuNWE5MOmc2jUNzC7hUl5P1Lji4rbtv_7NxvCc8IXScYbWgQ-dGQ99_hGf06q1dOIxcJ0sJZUwnKUBri99UrCNwzjqKONYpv1pzoxgf0HHUr6YKv5H69Am3iU_J8Ip3bCDk8wT9hc9huGiOHfw1PhKZaFHNcKXaHfxf8ILaqK5b8E"/>
</div>
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Alterar Senha</h1>
<p class="font-body-md text-on-surface-variant text-sm px-4">
                Para sua segurança, escolha uma senha forte e que não tenha sido usada anteriormente.
            </p>
</div>
<!-- Form -->
<form class="w-full space-y-6" id="passwordForm" onsubmit="event.preventDefault();">
<!-- Senha Atual -->
<div class="space-y-1">
<label class="font-label-bold text-label-bold text-primary block" for="current-password">Senha Atual</label>
<div class="relative group">
<input class="w-full h-target-min px-4 bg-surface-container-low border-2 border-outline-variant rounded transition-all focus:border-primary text-body-md font-body-md" id="current-password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center" onclick="togglePassword('current-password', this)" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Nova Senha -->
<div class="space-y-1">
<label class="font-label-bold text-label-bold text-primary block" for="new-password">Nova Senha</label>
<div class="relative group">
<input class="w-full h-target-min px-4 bg-surface-container-low border-2 border-outline-variant rounded transition-all focus:border-primary text-body-md font-body-md" id="new-password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center" onclick="togglePassword('new-password', this)" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirmar Nova Senha -->
<div class="space-y-1">
<label class="font-label-bold text-label-bold text-primary block" for="confirm-password">Confirmar Nova Senha</label>
<div class="relative group">
<input class="w-full h-target-min px-4 bg-surface-container-low border-2 border-outline-variant rounded transition-all focus:border-primary text-body-md font-body-md" id="confirm-password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center" onclick="togglePassword('confirm-password', this)" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Password Requirements Footer Note -->
<div class="flex items-start gap-2 bg-surface-container-high p-3 rounded-lg">
<span class="material-symbols-outlined text-primary text-sm mt-0.5">info</span>
<p class="text-[12px] text-on-surface-variant font-medium leading-relaxed">
                    Sua senha deve conter pelo menos 8 caracteres, incluindo letras e números.
                </p>
</div>
<!-- CTA Action -->
<button class="w-full h-target-min bg-secondary-container hover:bg-on-secondary-container text-white font-label-bold text-label-bold rounded shadow-sm transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span>Atualizar Senha</span>
<span class="material-symbols-outlined text-[20px]">sync</span>
</button>
</form>
<!-- Navigation Link -->
<div class="mt-8">
<a class="font-label-bold text-label-bold text-primary hover:text-secondary-container transition-colors flex items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span>Voltar para o Login</span>
</a>
</div>
</main>
<!-- Background Decorative Elements (Modern Industrial Vibe) -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-20">
<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-surface-container-high rounded-full blur-3xl -mr-64 -mt-64"></div>
<div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-secondary-fixed rounded-full blur-3xl -ml-64 -mb-64"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-5" style="background-image: radial-gradient(#1a2b48 1px, transparent 1px); background-size: 32px 32px;">
</div>
</div>
<script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('.material-symbols-outlined');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Form submission micro-interaction
        const form = document.getElementById('passwordForm');
        form.addEventListener('submit', () => {
            const btn = form.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span> Processando...`;
            
            // Simulating API call
            setTimeout(() => {
                btn.classList.replace('bg-secondary-container', 'bg-green-600');
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Senha Atualizada!`;
                
                setTimeout(() => {
                    btn.disabled = false;
                    btn.classList.replace('bg-green-600', 'bg-secondary-container');
                    btn.innerHTML = originalContent;
                }, 2000);
            }, 1500);
        });
    </script>
</body></html>
